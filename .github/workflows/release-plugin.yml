name: Release plugin assets

# When a release is published, attach plugin.json (Misskey plugin API shape),
# SHA512 of the LF-normalized AiScript source, and install hints — see README.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-plugin-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build plugin.json, SHA512.txt, install.txt
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          script = pathlib.Path("notifications.aiscript")
          if not script.is_file():
              raise SystemExit(f"Missing {script}")

          raw = script.read_text(encoding="utf-8")
          src_lf = raw.replace("\r\n", "\n").replace("\r", "\n")

          dev_marker = 'version: "dev"'
          if dev_marker not in src_lf:
              raise SystemExit(
                  f"Release build expected {dev_marker!r} in notifications.aiscript "
                  "(replace-on-release)."
              )

          def aiscript_escape(s: str) -> str:
              return s.replace("\\", "\\\\").replace('"', '\\"')

          src_lf = src_lf.replace(
              dev_marker,
              f'version: "{aiscript_escape(tag)}"',
              1,
          )

          digest = hashlib.sha512(src_lf.encode("utf-8")).hexdigest()
          api_url = f"https://github.com/{repo}/releases/download/{tag}/plugin.json"
          encoded = urllib.parse.quote(api_url, safe="")

          plugin = {"type": "plugin", "data": src_lf}
          pathlib.Path("plugin.json").write_text(
              json.dumps(plugin, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("SHA512.txt").write_text(digest + "\n", encoding="utf-8")
          pathlib.Path("install.txt").write_text(
              "\n".join(
                  [
                      "Fediverse Notifications — Misskey external install",
                      "",
                      "Plugin API URL:",
                      api_url,
                      "",
                      'SHA-512 (hex, LF-normalized AiScript in plugin.json "data"):',
                      digest,
                      "",
                      "Install on your instance (replace {HOST} with your Misskey host):",
                      f"https://{{HOST}}/install-extensions?url={encoded}&hash={digest}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload assets and append release notes (REST API, no gh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 << 'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          release_id = os.environ["RELEASE_ID"]
          upload_url = os.environ["UPLOAD_URL"]
          tag = os.environ["TAG"]
          names = ("plugin.json", "SHA512.txt", "install.txt")

          def headers(*, content_type=None):
              h = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "plugin-notifications-release-workflow",
              }
              if content_type is not None:
                  h["Content-Type"] = content_type
              return h

          api = f"https://api.github.com/repos/{repo}/releases/{release_id}"
          req = urllib.request.Request(api, headers=headers())
          with urllib.request.urlopen(req) as resp:
              release = json.load(resp)

          want = set(names)
          for asset in release.get("assets") or []:
              if asset.get("name") in want:
                  aid = asset["id"]
                  del_url = f"https://api.github.com/repos/{repo}/releases/assets/{aid}"
                  dreq = urllib.request.Request(del_url, method="DELETE", headers=headers())
                  urllib.request.urlopen(dreq).read()

          base = upload_url.split("{", 1)[0]
          for name in names:
              path = pathlib.Path(name)
              data = path.read_bytes()
              q = urllib.parse.urlencode({"name": name})
              url = f"{base}?{q}"
              ureq = urllib.request.Request(
                  url,
                  method="POST",
                  headers=headers(content_type="application/octet-stream"),
                  data=data,
              )
              urllib.request.urlopen(ureq).read()

          digest = pathlib.Path("SHA512.txt").read_text(encoding="utf-8").strip()
          api_url = f"https://github.com/{repo}/releases/download/{tag}/plugin.json"
          encoded = urllib.parse.quote(api_url, safe="")
          coretalk_install = (
              f"https://coretalk.space/install-extensions?url={encoded}&hash={digest}"
          )

          marker_start = "<!-- plugin-install-ci:begin -->"
          marker_end = "<!-- plugin-install-ci:end -->"
          generic = (
              f"https://{{HOST}}/install-extensions?url={encoded}&hash={digest}"
          )

          markdown = "\n".join(
              [
                  marker_start,
                  "",
                  "### Misskey plugin install (generated)",
                  "",
                  f"**Version (Git tag):** `{tag}`",
                  "",
                  f"**Plugin API URL:** {api_url}",
                  "",
                  f"**SHA-512 (hex):** `{digest}`",
                  "",
                  f"**coretalk.space:** [Install on this instance]({coretalk_install})",
                  "",
                  "<details>",
                  "<summary>Generic install URL</summary>",
                  "",
                  f"`{generic}`",
                  "",
                  "Replace `{HOST}` with your Misskey server.",
                  "</details>",
                  "",
                  marker_end,
              ]
          )

          current_body = release.get("body") or ""
          if marker_start in current_body and marker_end in current_body:
              pattern = re.compile(
                  re.escape(marker_start) + r".*?" + re.escape(marker_end),
                  re.DOTALL,
              )
              new_body = pattern.sub(markdown.strip(), current_body)
          else:
              new_body = current_body.rstrip() + "\n\n" + markdown.strip()

          patch_payload = json.dumps({"body": new_body}).encode()
          patch_req = urllib.request.Request(
              api,
              method="PATCH",
              data=patch_payload,
              headers=headers(content_type="application/json"),
          )
          urllib.request.urlopen(patch_req).read()
          PY
